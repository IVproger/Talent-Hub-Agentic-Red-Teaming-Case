<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>MOROK · Бейджи, теги, статусы</title>
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
<style>body{padding:40px;display:flex;flex-direction:column;gap:24px;max-width:1100px}.demo{display:flex;flex-direction:column;gap:12px}.demo h4{margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mk-color-text-tertiary)}</style>
</head><body>
<div class="mk-stack mk-gap-1"><a href="../index.html" class="mk-meta">← Дизайн-кит</a><h1 class="mk-h1">Бейджи, теги, статусы</h1></div>

<div class="demo"><h4>Вердикты (mono)</h4><div class="mk-row mk-gap-2" style="flex-wrap:wrap">
<span class="mk-badge mk-badge--proven">PROVEN</span><span class="mk-badge mk-badge--not-proven">NOT PROVEN</span><span class="mk-badge mk-badge--running">RUNNING</span><span class="mk-badge mk-badge--pending">PENDING</span><span class="mk-badge mk-badge--pass">PASS</span><span class="mk-badge mk-badge--fail">FAIL</span></div></div>
<div class="demo"><h4>Критичность</h4><div class="mk-row mk-gap-2"><span class="mk-sev mk-sev--critical">Критично</span><span class="mk-sev mk-sev--high">Высокий</span><span class="mk-sev mk-sev--none">Отражено</span></div></div>
<div class="demo"><h4>Теги поверхности атаки</h4><div class="mk-row mk-gap-2"><span class="mk-tag">инструменты</span><span class="mk-tag mk-tag--memory">память</span><span class="mk-tag mk-tag--mcp">MCP</span><span class="mk-tag">состояние</span></div></div>
<div class="demo"><h4>Статусы с точкой</h4><div class="mk-row mk-gap-4"><span class="mk-status mk-status--ok">подключён</span><span class="mk-status">не проверено</span><span class="mk-status mk-status--info">точка входа</span></div></div>
<script src="../js/components.js"></script>
