[server]
address = "127.0.0.1"
port = 8502
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Тема из design/ (Alfa Core Components, light). Веб-шрифты кит запрещает —
# системный sans. Акцент — фирменный красный #ef3124.
[theme]
base = "light"
primaryColor = "#ef3124"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f3f5"
textColor = "#030306"
font = "sans serif"
